<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Södra Bohusläns Konsultbyrå</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      background: #fff;
      color: #111;
      margin: 0;
      font-family: 'Georgia', 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      margin-top: 50px;
    }
    .logo-top {
      margin-bottom: 30px;
    }
    .logo-svg {
      display: block;
      width: 270px;
      height: 230px;
      margin: 0 auto 12px auto;
    }
    .lines {
      text-align: center;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    .lines .sodra {
      font-size: 2.6rem;
      font-weight: bold;
      letter-spacing: 0.07em;
      margin-bottom: 2px;
      margin-top: 6px;
    }
    .lines .bohuslans {
      font-size: 2.7rem;
      font-weight: bold;
      letter-spacing: 0.07em;
    }
    .lines .konsultbyra {
      font-size: 1.28rem;
      font-weight: normal;
      letter-spacing: 0.32em;
      margin-top: 10px;
      margin-bottom: 0;
    }
    .contact {
      margin-top: 38px;
      text-align: center;
      font-size: 1.08rem;
      letter-spacing: 0.04em;
    }
    .contact a {
      color: #111;
      text-decoration: none;
      border-bottom: 1px dotted #333;
      transition: border 0.2s;
      word-break: break-all;
    }
    .contact a:hover {
      border-bottom: 2px solid #111;
    }
  </style>
</head>
<body>
<main>
  <div class="logo-top">
    <!-- Din SVG/Logotyp-motiv -->
    <svg class="logo-svg" viewBox="0 0 240 210" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="220" height="170" fill="white" stroke="#111" stroke-width="6"/>
      <circle cx="50" cy="55" r="25" stroke="#111" stroke-width="5" fill="none"/>
      <path d="M25 90 Q90 60 200 100" stroke="#111" stroke-width="4" fill="none"/>
      <path d="M32 110 Q90 90 190 120" stroke="#111" stroke-width="3" fill="none"/>
      <path d="M50 140 Q80 170 200 160 Q160 145 160 160 Q73 200 110 175 Q120 155 125 145" stroke="#111" stroke-width="3" fill="none"/>
      <rect x="138" y="68" width="14" height="44" fill="white" stroke="#111" stroke-width="5"/>
      <rect x="143" y="97" width="4" height="15" fill="#111"/>
      <ellipse cx="145" cy="68" rx="10" ry="4" fill="white" stroke="#111" stroke-width="2"/>
      <rect x="141" y="60" width="8" height="8" fill="white" stroke="#111" stroke-width="2"/>
      <rect x="144" y="53" width="2.5" height="7" fill="#111"/>
    </svg>
  </div>
  <div class="lines">
    <div class="sodra">SÖDRA</div>
    <div class="bohuslans">BOHUSLÄNS</div>
    <div class="konsultbyra">KONSULTBYRÅ</div>
  </div>
  <div class="contact">
    <div>
      <a href="mailto:fredrik@sbkb.se">fredrik@sbkb.se</a>
    </div>
    <div>
      <a href="tel:+46722413887">0722 / 413887</a>
    </div>
  </div>
</main>
</body>
</html>
